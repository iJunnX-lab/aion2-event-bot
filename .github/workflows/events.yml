name: AION 2 Event Notifications

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a Discord test notification?"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: write

concurrency:
  group: aion2-event-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Send Discord test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification == 'yes' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import requests

          webhook = os.environ["DISCORD_WEBHOOK"]

          payload = {
              "username": "AION 2 Eventos",
              "embeds": [
                  {
                      "title": "🧪 AION 2 Event Bot — Prueba",
                      "description": (
                          "✅ **¡Conexión exitosa!**\n\n"
                          "El sistema de notificaciones de AION 2 "
                          "está conectado correctamente con Discord.\n\n"
                          "⚔️ ¡Listos para Atreia!"
                      ),
                      "color": 8207615,
                      "footer": {
                          "text": "AION 2 Event Notifications"
                      }
                  }
              ]
          }

          response = requests.post(webhook, json=payload, timeout=20)
          response.raise_for_status()

          print("Discord test notification sent successfully!")
          PY

      - name: Check events and notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python aion2-discord-events/event_bot.py

      - name: Save duplicate-protection state
        run: |
          if git diff --quiet aion2-discord-events/state.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aion2-discord-events/state.json
          git commit -m "Update AION 2 notification state"
          git pull --rebase
          git push
